[package]
name = "outlook-for-linux"
version = "0.4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ctap-hid-fido2 = "3"
base64 = "0.22"
percent-encoding = "2"

[target."cfg(target_os = \"linux\")".dependencies]
# enable-webauthn is set via GObject property (bindings lack the typed method)
webkit2gtk = "2"
notify-rust = "4"
