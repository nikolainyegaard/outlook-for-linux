[package]
name = "outlook-for-linux"
version = "0.7.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: Window + child Webview (one window, several webviews); see open_main
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ctap-hid-fido2 = "3"
base64 = "0.22"
percent-encoding = "2"
# app icon: PNG decode and resize for the tray badge and the icon theme copy
image = { version = "0.25", default-features = false, features = ["png"] }
# app icon: org.kde.KIconLoader.iconChanged after writing the icon theme
zbus = "5"
# tray menu dialogs and set_titlebar(None); see open_window
gtk = "0.18"

[target."cfg(target_os = \"linux\")".dependencies]
# enable-webauthn is set via GObject property (bindings lack the typed method)
webkit2gtk = "2"
notify-rust = "4"
