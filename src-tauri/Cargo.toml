[package]
name = "outlook-for-linux"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ctap-hid-fido2 = "3"
base64 = "0.22"

[target."cfg(target_os = \"linux\")".dependencies]
# enable-webauthn is set via GObject property (bindings lack the typed method)
webkit2gtk = "2"
